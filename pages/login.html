<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Connexion | ImmoSim Pro</title>
    <link rel="stylesheet" href="../css/landing.css">
    <style>
        body { min-height: 100vh; display: flex; flex-direction: column; background: linear-gradient(135deg, #f0f4ff 0%, #f8fafc 100%); }
        .auth-wrapper { flex: 1; display: flex; align-items: center; justify-content: center; padding: 40px 20px; }
        .auth-card { background: white; border-radius: 20px; padding: 40px; width: 100%; max-width: 420px; box-shadow: 0 12px 40px rgba(0,0,0,.1); }
        .auth-logo { display: flex; align-items: center; gap: 10px; font-size: 1.25rem; font-weight: 700; color: #0f172a; margin-bottom: 32px; justify-content: center; }
        .auth-logo strong { font-weight: 800; }
        .auth-title { font-size: 1.5rem; font-weight: 800; color: #0f172a; margin-bottom: 8px; text-align: center; }
        .auth-subtitle { font-size: .88rem; color: #64748b; text-align: center; margin-bottom: 32px; }
        .auth-form .form-group { margin-bottom: 16px; }
        .auth-form label { display: block; font-size: .82rem; font-weight: 600; color: #334155; margin-bottom: 6px; }
        .auth-form input { width: 100%; padding: 12px 16px; border: 1.5px solid #e2e8f0; border-radius: 10px; font-size: .9rem; color: #0f172a; font-family: 'Poppins',sans-serif; transition: border-color .2s; }
        .auth-form input:focus { outline: none; border-color: #4361ee; box-shadow: 0 0 0 3px rgba(67,97,238,.1); }
        .auth-forgot { display: block; text-align: right; font-size: .78rem; color: #4361ee; margin-top: 4px; }
        .auth-submit { width: 100%; padding: 14px; background: #4361ee; color: white; border: none; border-radius: 10px; font-size: .95rem; font-weight: 700; cursor: pointer; font-family: 'Poppins',sans-serif; transition: background .2s; margin-top: 8px; }
        .auth-submit:hover { background: #3451d1; }
        .auth-divider { display: flex; align-items: center; gap: 12px; margin: 24px 0; color: #94a3b8; font-size: .8rem; }
        .auth-divider::before, .auth-divider::after { content: ''; flex: 1; height: 1px; background: #e2e8f0; }
        .auth-switch { text-align: center; font-size: .85rem; color: #64748b; margin-top: 24px; }
        .auth-switch a { color: #4361ee; font-weight: 600; }
        .auth-demo-btn { width: 100%; padding: 12px; background: #f1f5f9; color: #334155; border: 1.5px solid #e2e8f0; border-radius: 10px; font-size: .9rem; font-weight: 600; cursor: pointer; font-family: 'Poppins',sans-serif; }
        .auth-demo-btn:hover { background: #e2e8f0; }
        .auth-footer { text-align: center; padding: 20px; font-size: .75rem; color: #94a3b8; }
        .auth-footer a { color: #64748b; }
    </style>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700;800&display=swap" rel="stylesheet">
</head>
<body>
    <div class="auth-wrapper">
        <div class="auth-card">
            <div class="auth-logo">
                <svg width="28" height="28" viewBox="0 0 32 32" fill="none"><rect width="32" height="32" rx="8" fill="#4361ee"/><path d="M6 24V14l10-8 10 8v10H20v-6h-4v6H6z" fill="white"/></svg>
                ImmoSim<strong>Pro</strong>
            </div>
            <h1 class="auth-title">Bon retour 👋</h1>
            <p class="auth-subtitle">Connectez-vous à votre espace professionnel</p>

            <form class="auth-form" id="loginForm">
                <div class="form-group">
                    <label for="loginEmail">Adresse email</label>
                    <input type="email" id="loginEmail" placeholder="votre@email.com" required autocomplete="email">
                </div>
                <div class="form-group">
                    <label for="loginPassword">Mot de passe</label>
                    <input type="password" id="loginPassword" placeholder="••••••••" required autocomplete="current-password">
                    <a href="#" class="auth-forgot">Mot de passe oublié ?</a>
                </div>
                <button type="submit" class="auth-submit">Se connecter</button>
            </form>

            <div class="auth-divider">ou</div>
            <button class="auth-demo-btn" onclick="window.location.href='../app.html'">
                Accéder à la démo (sans compte)
            </button>

            <div class="auth-switch">
                Pas encore de compte ?
                <a href="register.html">Créer un compte gratuit</a>
            </div>
        </div>
    </div>
    <div class="auth-footer">
        <a href="../index.html">← Retour au site</a> &nbsp;·&nbsp;
        <a href="mentions-legales.html">Mentions légales</a> &nbsp;·&nbsp;
        <a href="politique-confidentialite.html">Confidentialité</a>
    </div>

    <script>
    document.getElementById('loginForm').addEventListener('submit', (e) => {
        e.preventDefault();
        // Demo: redirect to app
        window.location.href = '../app.html';
    });
    </script>
</body>
</html>
